[project]
name = "shadow-backend"
version = "0.1.0"
description = "FastAPI sidecar for Shadow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "polars>=1.14.0",
  "scikit-learn>=1.5.0",
  "numpy>=2.0.0",
  "langgraph>=0.2.52",
  "langchain>=0.3.9",
  "langchain-openai>=0.2.9",
  "langchain-core>=0.3.19",
  "RestrictedPython>=7.0",
  "httpx>=0.27.0",
  "duckdb>=1.1.0",
  "networkx>=3.2.0",
  "python-multipart>=0.0.12",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "faker>=33.0.0",
]

[tool.uv]
dev-dependencies = []
